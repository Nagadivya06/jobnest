<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anath Adhya – Your health, in one safe place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Optional libraries: OCR (document scanning) and QR codes. The app still works without them. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
  :root{--indigo:#2a12b8;--indigo-d:#1b0a85;--ice:#eef8fe;--sky:#d6eefb;--steel:#7fa6c4;--ink:#14123a;--muted:#55587a;--ok:#12805c;--okbg:#e3f6ee;--warn:#8a5a00;--warnbg:#fff3d6;--bad:#b3261e;--badbg:#fde8e6;--r:16px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Montserrat','Noto Sans Devanagari','Noto Sans Telugu',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fff;line-height:1.55;font-size:16px}
  body.simple{font-size:19px}
  body.simple .adv{display:none!important}
  body.simple .btn{padding:16px 28px;font-size:1.1rem}
  body.simple .tile{padding:34px 26px}
  body.simple .tile .ic{font-size:3.6rem}
  body.simple #nav button{font-size:1.1rem;padding:14px 20px}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px}
  .sr{position:absolute;left:-9999px}
  .muted{color:var(--muted);font-size:.92rem}
  [hidden]{display:none!important}

  /* Logo */
  .logo{display:inline-flex;align-items:center;font-weight:900;letter-spacing:.5px;color:var(--indigo);line-height:1;font-size:22px}
  .logo svg{width:.95em;height:1.45em;margin:0 .1em;flex:none}

  /* Header */
  header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--sky)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  select,input,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:2px solid var(--sky);border-radius:10px;padding:9px 12px;width:100%}
  .ctl select{width:auto;padding:7px 10px;font-size:.85rem}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--indigo)}
  textarea{resize:vertical}
  .pill{border:2px solid var(--sky);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink)}
  .pill[aria-pressed="true"]{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .mic{width:44px;height:44px;border-radius:50%;border:0;background:var(--indigo);color:#fff;font-size:20px;cursor:pointer;flex:none}
  .mic:hover{background:var(--indigo-d)}
  #nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
  #nav button{flex:none;border:0;background:transparent;font-weight:700;font-size:.88rem;padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap}
  #nav button:hover{background:var(--ice)}
  #nav button[aria-current="page"]{background:var(--indigo);color:#fff}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-weight:700;font-size:.95rem;padding:11px 20px;border-radius:999px;background:var(--indigo);color:#fff;transition:background .2s,transform .1s}
  .btn:hover{background:var(--indigo-d)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--indigo);box-shadow:inset 0 0 0 2px var(--indigo)}
  .btn.ghost:hover{background:var(--indigo);color:#fff}
  .btn.sm{padding:7px 14px;font-size:.82rem}
  .btn.danger{background:var(--bad)}
  .btn.light{background:#fff;color:var(--indigo)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* Layout */
  .view{padding:34px 0 80px}
  h1{font-size:clamp(30px,5vw,54px);font-weight:900;line-height:1.08;color:var(--indigo);letter-spacing:-1px}
  h2{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--indigo);letter-spacing:-.4px;margin-bottom:6px}
  h3{font-size:1.05rem;font-weight:700;margin-bottom:8px}
  .lead{color:var(--muted);max-width:640px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--sky);border-radius:var(--r);padding:22px;box-shadow:0 8px 24px rgba(42,18,184,.05)}
  .card+.card{margin-top:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .grid2>.card+.card{margin-top:0}
  .f{display:grid;gap:12px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{font-weight:600;font-size:.85rem;display:block;margin-bottom:4px}

  /* Hero */
  .hero{background:var(--ice);position:relative;overflow:hidden;padding:56px 0 60px;margin-top:-34px}
  .hero .ghost{position:absolute;right:-10px;bottom:-40px;font-weight:900;font-size:clamp(120px,22vw,300px);color:#fff;opacity:.8;letter-spacing:-6px;line-height:1;pointer-events:none;user-select:none}
  .hero .in{position:relative}
  .hero p{margin:18px 0 26px;font-size:1.1rem;color:var(--muted);max-width:600px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:30px}
  .tile{text-align:left;border:0;cursor:pointer;background:var(--ice);border-left:6px solid var(--indigo);border-radius:var(--r);padding:24px;transition:transform .15s,box-shadow .15s;color:var(--ink)}
  .tile:nth-child(2n){border-left-color:var(--steel)}
  .tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(42,18,184,.12)}
  .tile .ic{font-size:2.2rem;display:block;margin-bottom:6px}
  .tile b{display:block;font-size:1.1rem;margin-bottom:4px}
  .tile span.d{font-size:.9rem;color:var(--muted)}

  /* Tabs */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .tab{border:2px solid var(--sky);background:#fff;padding:8px 16px;border-radius:999px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}

  /* Chips, badges, alerts */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .chip{border:2px solid var(--sky);background:#fff;padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .chip.static{cursor:default;background:var(--ice)}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--sky);color:var(--indigo-d)}
  .badge.ok{background:var(--okbg);color:var(--ok)}
  .badge.warn{background:var(--warnbg);color:var(--warn)}
  .badge.bad{background:var(--badbg);color:var(--bad)}
  .alert{padding:12px 14px;border-radius:12px;margin-bottom:8px;font-weight:600;font-size:.92rem}
  .alert.warn{background:var(--warnbg);color:var(--warn)}
  .alert.bad{background:var(--badbg);color:var(--bad)}
  .alert.ok{background:var(--okbg);color:var(--ok)}

  /* Lists */
  .rec{padding:16px 0;border-bottom:1px solid var(--sky)}
  .rec:last-child{border:0}
  .rec h3{margin-bottom:2px}
  .rec p{font-size:.9rem;color:var(--muted);margin:6px 0 10px;white-space:pre-line}
  mark{background:#ffe27a;border-radius:3px;padding:0 2px}
  .dose{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sky)}
  .dose:last-child{border:0}
  .dose .tm{font-weight:800;color:var(--indigo);min-width:58px}
  .dose .nm{flex:1}
  .dose small{display:block;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--sky)}
  th{font-size:.78rem;color:var(--muted)}
  .out{background:var(--ice);border-radius:12px;padding:16px;margin-top:14px;font-size:.95rem}
  .out .plain{color:var(--indigo);font-weight:500}
  .out h4{font-size:.85rem;color:var(--muted);margin:12px 0 4px}
  .out h4:first-child{margin-top:0}

  /* Timeline */
  .tl{border-left:3px solid var(--sky);margin-left:8px;padding-left:22px}
  .tl .yr{font-weight:900;color:var(--indigo);margin:18px 0 8px;font-size:1.1rem}
  .tl .it{position:relative;padding:4px 0 18px}
  .tl .it::before{content:"";position:absolute;left:-30px;top:8px;width:13px;height:13px;border-radius:50%;background:var(--indigo);border:3px solid #fff;box-shadow:0 0 0 2px var(--indigo)}

  /* Chat */
  .chat{max-height:380px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
  .msg{padding:11px 15px;border-radius:16px;max-width:88%;font-size:.95rem;white-space:pre-line}
  .msg.u{align-self:flex-end;background:var(--indigo);color:#fff;border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start;background:var(--ice);border-bottom-left-radius:4px}
  .msg small{display:block;margin-top:6px;color:var(--muted);font-size:.78rem}

  /* Emergency */
  .em-big{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .em-box{border-radius:var(--r);padding:18px;text-align:center}
  .em-box.red{background:var(--badbg);color:var(--bad)}
  .em-box.amber{background:var(--warnbg);color:var(--warn)}
  .em-box b{display:block;font-size:2.4rem;font-weight:900;line-height:1.1}
  .em-box.amber b{font-size:1.3rem}
  .em-box span{font-size:.8rem;font-weight:700}
  .qrbox{display:grid;place-items:center;padding:14px;background:#fff;border:2px dashed var(--steel);border-radius:14px;min-height:200px}
  .qrbox pre{font-size:.72rem;white-space:pre-wrap;text-align:left}
  .net-state{font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:999px}
  .net-state.on{background:var(--okbg);color:var(--ok)}
  .net-state.off{background:var(--warnbg);color:var(--warn)}

  /* Passport */
  .passport{background:linear-gradient(135deg,var(--indigo),#4a2fe0 60%,#6f7bff);color:#fff;border-radius:22px;padding:28px;box-shadow:0 20px 50px rgba(42,18,184,.25)}
  .passport h2{color:#fff}
  .passport .hid{font-weight:800;letter-spacing:2px;font-size:1.1rem}
  .passport dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0;font-size:.92rem}
  .passport dt{opacity:.75}
  .passport .qrbox{background:#fff;color:var(--ink)}
  .provider{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--sky);flex-wrap:wrap}
  .provider:last-child{border:0}
  .provider .pi{font-size:1.8rem}
  .provider .pn{flex:1;min-width:180px}
  .hub line{stroke:#cfd8e3;stroke-width:3}
  .hub line.on{stroke:var(--indigo)}
  .hub text{font-size:22px;text-anchor:middle}
  .hub .lb{font-size:11px;font-weight:700;fill:var(--muted)}

  /* Toast & voice bar */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,160px);background:var(--ink);color:#fff;padding:14px 22px;border-radius:18px;font-weight:600;font-size:.92rem;transition:transform .35s;z-index:99;max-width:92vw;text-align:center}
  .toast.show{transform:translate(-50%,0)}
  .voicebar{position:fixed;left:0;right:0;bottom:0;background:var(--indigo);color:#fff;padding:18px 20px;z-index:98;display:none;text-align:center;font-weight:700;font-size:1.1rem}
  .voicebar.on{display:block}
  .voicebar .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ff5a5a;margin-right:10px;animation:pl 1s infinite}
  @keyframes pl{50%{opacity:.25}}
  footer{padding:28px 0;background:var(--ink);color:#b9bbd9;font-size:.85rem}
  footer .logo{color:#fff;font-size:18px;margin-bottom:8px}

  @media (max-width:820px){.grid2,.f2,.em-big{grid-template-columns:1fr}.ctl select#member{max-width:120px}}
  @media (max-width:560px){.ctl .pill span{display:none}}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.toast,.voicebar .dot{transition:none;animation:none}}
  @media print{header,footer,.view:not(#v-passport),.noprint,.toast{display:none!important}#v-passport{display:block!important;padding:0}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="steth" viewBox="0 0 40 60">
    <path d="M8 4v14a10 10 0 0 0 20 0V4" fill="none" stroke="#7fa6c4" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 28v10a10 10 0 0 0 20 0v-3" fill="none" stroke="#7fa6c4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="36" cy="30" r="5" fill="#d6eefb" stroke="#7fa6c4" stroke-width="3"/>
    <circle cx="8" cy="4" r="3" fill="#7fa6c4"/><circle cx="28" cy="4" r="3" fill="#7fa6c4"/>
  </symbol>
</svg>

<header>
  <div class="wrap top">
    <a href="#home" class="logo" aria-label="Anath Adhya">ANATH<svg aria-hidden="true"><use href="#steth"/></svg>DHYA</a>
    <div class="ctl">
      <label class="sr" for="member">Family member</label><select id="member"></select>
      <label class="sr" for="lang">Language</label>
      <select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option><option value="te">తెలుగు</option></select>
      <button class="pill" id="simpleBtn" aria-pressed="false">👴 <span data-i18n="simple_mode"></span></button>
      <button class="mic" id="micBtn" aria-label="Voice assistant" title="Voice assistant">🎤</button>
    </div>
  </div>
  <nav class="wrap" id="nav" aria-label="Main">
    <button data-act="go" data-v="home">🏠 <span data-i18n="nav_home"></span></button>
    <button data-act="go" data-v="records">📂 <span data-i18n="nav_records"></span></button>
    <button data-act="go" data-v="ai">🧠 <span data-i18n="nav_ai"></span></button>
    <button data-act="go" data-v="medicines">💊 <span data-i18n="nav_meds"></span></button>
    <button data-act="go" data-v="emergency">🚨 <span data-i18n="nav_emergency"></span></button>
    <button data-act="go" data-v="network">🏥 <span data-i18n="nav_network"></span></button>
    <button data-act="go" data-v="passport">🛂 <span data-i18n="nav_passport"></span></button>
  </nav>
</header>

<main>
<!-- ===================== HOME ===================== -->
<section class="view" id="v-home">
  <div class="hero">
    <div class="ghost" aria-hidden="true">ADHYA</div>
    <div class="wrap in">
      <p class="muted" style="margin:0 0 6px"><span data-i18n="hello"></span> <b id="homeName"></b></p>
      <h1 data-i18n="hero_title"></h1>
      <p data-i18n="hero_sub"></p>
      <div class="row">
        <button class="btn" data-act="voice">🎤 <span data-i18n="ask_voice"></span></button>
        <button class="btn ghost" data-act="go" data-v="emergency">🚨 <span data-i18n="nav_emergency"></span></button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="grid2" style="margin-top:30px">
      <div class="card"><h3>🔔 <span data-i18n="alerts"></span></h3><div id="homeAlerts"></div></div>
      <div class="card"><h3>⏰ <span data-i18n="today_doses"></span></h3><div id="homeDoses"></div></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>
</section>

<!-- ===================== RECORDS ===================== -->
<section class="view" id="v-records" hidden>
  <div class="wrap">
    <h2>📂 <span data-i18n="nav_records"></span></h2>
    <p class="lead" data-i18n="rec_lead"></p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-group="rec" data-tab="all" aria-selected="true"><span data-i18n="tab_all"></span></button>
      <button class="tab" role="tab" data-act="tab" data-group="rec" data-tab="timeline" aria-selected="false"><span data-i18n="tab_timeline"></span></button>
      <button class="tab" role="tab" data-act="tab" data-group="rec" data-tab="scan" aria-selected="false"><span data-i18n="tab_scan"></span></button>
      <button class="tab" role="tab" data-act="tab" data-group="rec" data-tab="share" aria-selected="false"><span data-i18n="tab_share"></span></button>
    </div>

    <div class="tp" data-group="rec" data-tab="all">
      <div class="card">
        <label class="sr" for="recSearch">Search</label>
        <div class="row"><input id="recSearch" data-i18n-ph="search_ph" style="flex:1;min-width:200px"><button class="mic" id="searchMic" aria-label="Voice search" style="width:42px;height:42px">🎤</button></div>
        <p class="muted" style="margin-top:6px" data-i18n="hosp_hint"></p>
        <div class="chips" id="hospChips"></div>
        <div id="recList"></div>
      </div>
    </div>

    <div class="tp" data-group="rec" data-tab="timeline" hidden>
      <div class="card"><h3>📊 <span data-i18n="tab_timeline"></span></h3><div class="tl" id="timeline"></div></div>
    </div>

    <div class="tp" data-group="rec" data-tab="scan" hidden>
      <div class="card">
        <h3>📷 <span data-i18n="scan_title"></span></h3>
        <p class="muted" data-i18n="scan_hint"></p>
        <div class="row" style="margin:12px 0">
          <label class="btn" style="cursor:pointer;margin:0">📷 <span data-i18n="take_photo"></span><input type="file" id="scanFile" accept="image/*" capture="environment" class="sr"></label>
          <button class="btn ghost" data-act="sampleScan">📄 <span data-i18n="sample_scan"></span></button>
        </div>
        <img id="scanPrev" alt="Scanned document preview" hidden style="max-width:260px;border-radius:12px;margin-bottom:10px">
        <p class="muted" id="scanStat"></p>
        <label for="scanText" data-i18n="doc_text"></label>
        <textarea id="scanText" rows="8"></textarea>
        <div class="f2" style="margin-top:12px">
          <div><label for="scType" data-i18n="doc_type"></label><select id="scType"></select></div>
          <div><label for="scDate" data-i18n="doc_date"></label><input id="scDate" type="date"></div>
          <div><label for="scHosp" data-i18n="hospital"></label><input id="scHosp"></div>
          <div><label for="scDoc" data-i18n="doctor"></label><input id="scDoc"></div>
        </div>
        <button class="btn" style="margin-top:14px" data-act="saveScan" data-i18n="save_record"></button>
      </div>
    </div>

    <div class="tp" data-group="rec" data-tab="share" hidden>
      <div class="grid2">
        <div class="card">
          <h3>🔐 <span data-i18n="grant_title"></span></h3>
          <p class="muted" data-i18n="grant_hint"></p>
          <div class="f" style="margin-top:12px">
            <div><label for="gWho" data-i18n="recipient"></label><select id="gWho"></select></div>
            <div id="gOtherBox" hidden><label for="gOther" data-i18n="recipient_name"></label><input id="gOther"></div>
            <div class="f2">
              <div><label for="gScope" data-i18n="scope"></label><select id="gScope"></select></div>
              <div><label for="gDur" data-i18n="duration"></label><select id="gDur">
                <option value="1">24 h</option><option value="7">7 d</option><option value="30">30 d</option><option value="0">∞</option></select></div>
            </div>
            <button class="btn" data-act="grant" data-i18n="grant_btn"></button>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="who_access"></h3>
          <div id="grantList"></div>
          <h3 style="margin-top:18px" data-i18n="access_log"></h3>
          <div id="logList" class="muted"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===================== AI ===================== -->
<section class="view" id="v-ai" hidden>
  <div class="wrap">
    <h2>🧠 <span data-i18n="nav_ai"></span></h2>
    <p class="lead" data-i18n="ai_lead"></p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-group="ai" data-tab="summary" aria-selected="true"><span data-i18n="ai_summary"></span></button>
      <button class="tab adv" role="tab" data-act="tab" data-group="ai" data-tab="compare" aria-selected="false"><span data-i18n="ai_compare"></span></button>
      <button class="tab" role="tab" data-act="tab" data-group="ai" data-tab="ask" aria-selected="false"><span data-i18n="ai_ask"></span></button>
      <button class="tab" role="tab" data-act="tab" data-group="ai" data-tab="emerg" aria-selected="false"><span data-i18n="ai_emerg"></span></button>
    </div>

    <div class="tp" data-group="ai" data-tab="summary">
      <div class="card">
        <label for="sumSel" data-i18n="pick_record"></label>
        <div class="row"><select id="sumSel" style="flex:1;min-width:220px"></select>

/* ---------------- Parsing helpers ---------------- */
function parseLabs(text){
  const out=[];
  String(text).split(/[\n;]+/).forEach(seg=>{
    const m=seg.match(/^\s*([A-Za-z][A-Za-z0-9 .]*?)\s*[:\-]?\s*(\d+(?:\.\d+)?)\s*([A-Za-z\/%µ]+)?\s*\(\s*(?:ref|normal|range)?\s*:?\s*([<>]?\s*[\d.]+(?:\s*[-–]\s*[\d.]+)?)\s*\)/i);
    if(!m) return;
    const name=m[1].trim().toLowerCase(), value=parseFloat(m[2]), ref=m[4].replace(/\s+/g,'');
    let low=null,high=null,r;
    if((r=ref.match(/^([\d.]+)[-–]([\d.]+)$/))){low=+r[1];high=+r[2]}
    else if((r=ref.match(/^<([\d.]+)$/)))high=+r[1];
    else if((r=ref.match(/^>([\d.]+)$/)))low=+r[1];
    const status=low!==null&&value<low?'low':(high!==null&&value>high?'high':'normal');
    out.push({name,value,unit:m[3]||'',ref,low,high,status});
  });
  return out;
}
function timesFor(n,timing){
  n=+n;
  if(n===2) return ['08:00','20:00'];
  if(n>=3) return ['08:00','14:00','21:00'];
  if(/night|bed/i.test(timing)) return ['21:00'];
  if(/evening/i.test(timing)) return ['18:00'];
  return ['08:00'];
}
const FREQ={once:1,twice:2,thrice:3,'three times':3};
function parseRx(text){
  const out=[];
  String(text).split(/[;\n]+|\.\s/).forEach(seg=>{
    const m=seg.match(/([A-Za-z][A-Za-z\-]+(?:\s[A-Za-z]+)?)\s+(\d+(?:\.\d+)?\s?(?:mg|mcg|g|ml|iu))\s+(once|twice|thrice|three times)\s+(?:a\s+)?(?:daily|a day|per day)(?:\s+(in the morning|at night|at bedtime|after food|before food|after meals|before meals|in the evening|with food))?(?:[^;]*?for\s+(\d+)\s+days)?/i);
    if(m){ const n=FREQ[m[3].toLowerCase()]; out.push({name:m[1].replace(/^(tab|tablet|cap|capsule)\s+/i,'').trim(),dose:m[2].replace(/\s+/,' '),n,timing:(m[4]||'').toLowerCase(),days:+(m[5]||30)}); }
  });
  return out;
}
function dxFrom(text){const l=String(text).toLowerCase();return TERMS.filter(x=>l.includes(x.k))}
function keyInfo(r){
  const labs=parseLabs(r.text),adv=(r.text.match(/advice\s*:\s*([^.\n;]+)/i)||[])[1],al=(r.text.match(/allerg(?:y|ies)\s*:\s*([^.\n;]+)/i)||[])[1];
  return{dx:dxFrom(r.text),labs,abnormal:labs.filter(x=>x.status!=='normal'),meds:parseRx(r.text),advice:adv&&adv.trim(),allergy:al&&al.trim()};
}
function guessType(s){return /twice daily|once daily|thrice daily|\brx\b|prescri|tablet/i.test(s)?'Prescription':/hemoglobin|hba1c|creatinine|cholesterol|\bref\b|laborator/i.test(s)?'Lab report':/discharge|admitted/i.test(s)?'Discharge summary':'Other'}
function guessHosp(s){const l=s.split('\n').map(x=>x.trim()).find(x=>/hospital|clinic|diagnostic|\blabs?\b|medical|centre|center/i.test(x));return l?l.replace(/\s+-\s+.*$/,'').slice(0,60):''}
function guessDate(s){
  let m=s.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?\s+(\d{4})\b/i);
  if(m){const mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase())+1;return `${m[3]}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  return todayStr();
}
async function ocr(file,prog){
  if(typeof Tesseract==='undefined') throw new Error('The OCR engine did not load. Connect to the internet once, or paste the text below.');
  const r=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text'&&prog)prog(Math.round(m.progress*100))}});
  return r.data.text;
}

function expiryISO(s){
  let m=s.match(/(?:exp(?:iry)?\.?(?:\s*date)?|use before)\s*[:\-]?\s*(\d{1,2})[\/\-](\d{2,4})/i);
  if(m){let y=+m[2];if(y<100)y+=2000;const d=new Date(y,+m[1],0);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  m=s.match(/exp(?:iry)?\.?(?:\s*date)?\s*[:\-]?\s*([A-Za-z]{3,9})\s*[,.\-]?\s*(\d{2,4})/i);
  if(m){const mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[1].slice(0,3).toLowerCase())+1;if(mo){let y=+m[2];if(y<100)y+=2000;const d=new Date(y,mo,0);return d.getFullYear()+'-'+String(mo).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}}
  return '';
}
function identifyMeds(text){
  const l=text.toLowerCase(),found=new Map();
  const names=[...Object.keys(MED_DB),...Object.keys(ALIAS)];
  names.forEach(n=>{
    const i=l.search(new RegExp('\\b'+n+'\\b'));
    if(i<0) return;
    const key=MED_DB[n]?n:ALIAS[n]; if(found.has(key)) return;
    const near=l.slice(i,i+60).match(/(\d+(?:\.\d+)?\s?(?:mg|mcg|g|ml))/);
    const info=MED_DB[key], allergy=info.cls&&/penicillin/i.test(M().profile.allergies||'');
    found.set(key,{key,shown:n,info,strength:near?near[1]:'',allergy});
  });
  return [...found.values()].map(x=>({...x,expiry:expiryISO(text)}));
}

function score(r,q){
  const hay=(r.text+' '+r.type+' '+r.hospital+' '+(r.doctor||'')+' '+r.date).toLowerCase();let s=0;

function doCompare(){

function smartAnswer(q){
  const m=M(),p=m.profile,ql=q.toLowerCase(),src=[];
  if(has(ql,'blood group','blood type','ब्लड ग्रुप','रक्त समूह','బ్లడ్ గ్రూప్','రక్త గ్రూపు')) return{text:`${t('blood')}: ${p.blood}`,src};
  if(has(ql,'allerg','एलर्जी','అలెర్జీ')) return{text:`${t('allergies')}: ${p.allergies||t('none')}`,src};
  if(has(ql,'medicine','tablet','pill','दवा','दवाई','दवाइयां','మందు','మందులు')){
    return{text:m.medicines.length?m.medicines.map(x=>`• ${x.name} ${x.dose} – ${x.times.join(', ')} (${x.timing})`).join('\n'):t('none'),src};
  }
  const labMap=[[['sugar','hba1c','glucose','diabetes','शुगर','मधुमेह','షుగర్','మధుమేహం'],['hba1c','fasting blood sugar']],[['hemoglobin','anemia','haemoglobin','हीमोग्लोबिन','హిమోగ్లోబిన్'],['hemoglobin']],[['cholesterol','कोलेस्ट्रॉल','కొలెస్ట్రాల్'],['total cholesterol']],[['kidney','creatinine','किडनी','కిడ్నీ'],['creatinine']]];
  const keys=labMap.filter(([w])=>has(ql,...w)).flatMap(x=>x[1]);
  if(keys.length){
    const lines=[];
    keys.forEach(k=>{const s=labSeries(k);if(!s.length) return;s.forEach(x=>src.push(x.rec));
      const last=s[s.length-1],first=s[0];
      let line=`${labName(k)}: `+s.map(x=>`${x.value} (${fd(x.rec.date)})`).join(' → ');
      if(s.length>1){const d1=dist(first),d2=dist(last);line+=` – ${t(d2<d1?'improved':d2>d1?'worsened':'stable')}`}
      line+=`, ${t(last.status)} [${last.ref}]`;lines.push(line)});
    if(lines.length) return{text:lines.join('\n'),src:[...new Set(src)]};
  }
  if(has(ql,'last report','latest','recent','last visit','पिछली','ఇటీవల','చివరి')){
    const r=[...m.records].sort((a,b)=>b.date.localeCompare(a.date))[0];if(r) return{text:summaryText(r).replace(/<br>/g,'\n').replace(/<[^>]+>/g,''),src:[r]};
  }

  const hits=m.records.map(r=>({r,s:score(r,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(hits.length){const r=hits[0].r;return{text:`${hits.length} × ${t('nav_records')}:\n${summaryText(r).replace(/<br>/g,'\n').replace(/<[^>]+>/g,'')}`,src:hits.slice(0,3).map(x=>x.r)}}

}

function provAction(p){
  const m=M();
  if(p.type==='hospital'){

  }else if(p.type==='doctor'){

    m.records.push({id:uid(),type:'Prescription',date:todayStr(),hospital:'Sunrise Hospital, Guntur',doctor:p.name.split(' (')[0],source:'e-Prescription',text});

    addLog(`${p.name} sent a lab report`);toast('New lab report received. Try AI → Compare reports.');
  }else{
    const need=Object.values(S.members).flatMap(mm=>mm.medicines).filter(x=>x.refillRequested||x.pills<=x.times.length*5);
    if(!need.length) return toast('No medicines need a refill right now.');

  }
  save();renderAll();
}
function addMedsFromRx(text){
  let n=0;

  save();return n;
}

}
$('#scanFile').onchange=e=>{const f=e.target.files[0];if(!f) return;$('#scanPrev').src=URL.createObjectURL(f);$('#scanPrev').hidden=false;scanInto(f,'#scanStat','#scanText',prefillScan)};
$('#medFile').onchange=e=>{const f=e.target.files[0];if(f) scanInto(f,'#medStat','#medText',showFound)};
$('#impFile').onchange=e=>{const f=e.target.files[0];if(!f) return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.members) throw 0;Object.values(d.members).forEach(m=>m.profile.pin=m.profile.pin||'0000');if(confirm('Replace the data in this browser with the imported passport?')){S=d;save();renderAll();toast('Passport imported.')}}catch(x){toast('That file is not a valid passport.')}};r.readAsText(f)};
$('#recSearch').oninput=e=>{recFilter.q=e.target.value;renderRecords()};
$('#searchMic').onclick=()=>listen(q=>{$('#recSearch').value=q;recFilter.q=q;renderRecords()});
$('#askMic').onclick=()=>listen(q=>{$('#askIn').value=q;sendAsk(q,true)});
$('#askIn').onkeydown=e=>{if(e.key==='Enter') sendAsk(null,false)};
$('#micBtn').onclick=()=>listen(handleVoice);
$('#gWho').onchange=e=>$('#gOtherBox').hidden=e.target.value!=='__other';
$('#lang').onchange=e=>{S.lang=e.target.value;save();renderAll();if(view==='emergency')loadEm();$('#chat').innerHTML='';chatAdd('a',{en:'Hello! Ask me about your records.',hi:'नमस्ते! अपने रिकॉर्ड के बारे में पूछिए।',te:'నమస్కారం! మీ రికార్డుల గురించి అడగండి.'}[S.lang])};
$('#member').onchange=e=>{S.active=e.target.value;save();renderAll();if(view==='emergency')loadEm()};
$('#simpleBtn').onclick=()=>{S.simple=!S.simple;save();renderAll();if(S.simple) speak({en:'Simple mode is on.',hi:'सरल मोड चालू है।',te:'సులభ మోడ్ ఆన్ అయింది.'}[S.lang])};
if('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------------- Init ---------------- */
renderAll();
chatAdd('a',{en:'Hello! Ask me about your records.',hi:'नमस्ते! अपने रिकॉर्ड के बारे में पूछिए।',te:'నమస్కారం! మీ రికార్డుల గురించి అడగండి.'}[S.lang]);
go(['home','records','ai','medicines','emergency','network','passport'].includes(location.hash.slice(1))?location.hash.slice(1):'home');
</script>
</body>
</html>
